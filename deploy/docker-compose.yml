services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceguard-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
